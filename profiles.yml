# ============================================================================
# profiles.yml — Snowsight Workspace (env_var backed by env.yml)
# ============================================================================
# role and warehouse must be literal values or context functions in Workspaces.
# account and user are handled by the Snowflake session.
snowflake_finance:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: ""
      user: ""
      role: FINANCE_ROLE
      warehouse: FINANCE_WH
      database: "{{ env_var('DBT_DATABASE') }}"
      schema: "{{ env_var('DBT_SCHEMA') }}"
      threads: 4
    prod:
      type: snowflake
      account: ""
      user: ""
      role: FINANCE_ROLE
      warehouse: FINANCE_WH
      database: "{{ env_var('DBT_DATABASE') }}"
      schema: "{{ env_var('DBT_SCHEMA') }}"
      threads: 8
